name: minio-proxy-lab-mpgo

services:

  # ---------------------------------------------------------------------------
  # MinIO — storage S3.
  # NÃO publica portas no host. É proposital: prova que o único caminho até o
  # objeto é o proxy reverso. Ver CLAUDE.md, decisão #4.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: mpl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Faz o MinIO se enxergar sob o hostname público do proxy.
      # Precisa incluir esquema, host E porta.
      MINIO_SERVER_URL: ${PUBLIC_SCHEME}://${PUBLIC_HOST}:${NGINX_HTTPS_PORT}
    volumes:
      - minio-data:/data
    networks:
      - lab
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---------------------------------------------------------------------------
  # NGINX — proxy reverso e terminação TLS.
  # Escuta nas MESMAS portas dentro e fora do container (8080/8443).
  # As portas do .env precisam bater com o 'listen' de nginx/nginx.conf;
  # scripts/lib/common.sh verifica isso e aborta se divergirem.
  # Se as portas divergissem, o Host assinado pelo mc (de dentro da rede) seria
  # diferente do Host enviado pelo navegador (de fora) e a assinatura SigV4
  # quebraria com SignatureDoesNotMatch.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mpl-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:${NGINX_HTTP_PORT}"
      - "${NGINX_HTTPS_PORT}:${NGINX_HTTPS_PORT}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      lab:
        aliases:
          # Faz o hostname público resolver também DE DENTRO da rede do compose,
          # para o container mc conseguir assinar a URL contra o proxy.
          - ${PUBLIC_HOST}
    depends_on:
      - minio

  # ---------------------------------------------------------------------------
  # mc — client auxiliar, efêmero. Usado apenas via `docker compose run`.
  # O profile impede que suba junto com `docker compose up`.
  # ---------------------------------------------------------------------------
  mc:
    image: minio/mc:latest
    profiles:
      - tools
    entrypoint: ["/bin/sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PRESIGN_USER: ${MINIO_PRESIGN_USER}
      MINIO_PRESIGN_PASSWORD: ${MINIO_PRESIGN_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      TEST_OBJECT: ${TEST_OBJECT}
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT}
      PRESIGN_EXPIRY: ${PRESIGN_EXPIRY}
    volumes:
      - ./assets:/assets:ro
      - ./policies:/policies:ro
      # Certificado do proxy montado como CA confiável do mc. É o que permite
      # gerar a URL pré-assinada sem --insecure, como a aplicação real faria.
      - ./nginx/certs/server.crt:/root/.mc/certs/CAs/lab-proxy.crt:ro
    networks:
      - lab
    depends_on:
      - minio

networks:
  lab:
    driver: bridge

volumes:
  minio-data:
