services:

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Abrir a :9000 no navegador leva para o console, igual em produção.
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_HOST}:9001
    ports:
      - "9000:9000"   # API, só para demonstrar o caminho errado
      - "9001:9001"   # console
    volumes:
      - ./certs/minio.crt:/root/.minio/certs/public.crt:ro
      - ./certs/minio.key:/root/.minio/certs/private.key:ro
    networks:
      lab:
        aliases: [ "${MINIO_HOST}" ]

  nginx:
    image: nginx:alpine
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      lab:
        aliases: [ "${APP_HOST}" ]
    depends_on: [ minio, app ]

  app:
    build: ./app
    env_file: .env
    networks: [ lab ]
    depends_on: [ minio ]

networks:
  lab:
