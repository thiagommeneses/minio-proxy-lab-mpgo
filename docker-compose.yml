name: minio-proxy-lab-mpgo

services:

  # ---------------------------------------------------------------------------
  # MinIO — storage S3, agora com TLS.
  # O certificado vem da ca-interna, que simula a Certificadora TLS do MP-GO e
  # NÃO é instalada no navegador. É essa desconfiança que reproduz a falha atual.
  # A porta da API S3 (9000) NÃO é publicada: o único caminho até o objeto é o
  # proxy. Só o console (9001) é publicado, para administração — apresenta o
  # certificado da ca-interna, então o navegador avisa, igual a produção.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: mpl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Hostname público do proxy. Inclui porta porque 8443 não é a padrão;
      # em produção, com 443, vai SEM porta.
      MINIO_SERVER_URL: ${PUBLIC_SCHEME}://${PUBLIC_HOST}:${NGINX_HTTPS_PORT}
      # URL do console. Em produção, abrir https://vm-lnx-0369:9000/ no
      # navegador redireciona para a :9001 — este valor reproduz o mesmo salto
      # no laboratório.
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_DIRECT_HOST}:${MINIO_CONSOLE_PORT}
    ports:
      # Apenas o console. A API S3 continua fechada.
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
      - ./nginx/certs/minio.crt:/root/.minio/certs/public.crt:ro
      - ./nginx/certs/minio.key:/root/.minio/certs/private.key:ro
    networks:
      lab:
        aliases:
          # Nome que consta no certificado do MinIO, usado pelo proxy no SNI
          # e pelo player do caminho "quebrado".
          - ${MINIO_DIRECT_HOST}
    healthcheck:
      # --insecure porque a CA interna não está no truststore da imagem.
      test: ["CMD", "mc", "ready", "--insecure", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---------------------------------------------------------------------------
  # NGINX — proxy reverso, TLS de borda e roteamento por caminho.
  #   /themisia/  -> app
  #   /memoriais/ -> MinIO  (o primeiro segmento É o bucket; sem rewrite)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mpl-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:${NGINX_HTTP_PORT}"
      - "${NGINX_HTTPS_PORT}:${NGINX_HTTPS_PORT}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      lab:
        aliases:
          - ${PUBLIC_HOST}
    depends_on:
      - minio
      - app

  # ---------------------------------------------------------------------------
  # app — ThemísIA/MemorIAis simulado (FastAPI + HTMX).
  # Gera as URLs pré-assinadas na listagem, como o sistema real.
  # Assinar é cálculo local: este container não precisa alcançar o MinIO.
  # ---------------------------------------------------------------------------
  app:
    build: ./app
    container_name: mpl-app
    restart: unless-stopped
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
      TEST_OBJECT: ${TEST_OBJECT}
      PUBLIC_HOST: ${PUBLIC_HOST}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT}
      MINIO_DIRECT_HOST: ${MINIO_DIRECT_HOST}
      MINIO_DIRECT_PORT: ${MINIO_DIRECT_PORT}
      MINIO_PRESIGN_USER: ${MINIO_PRESIGN_USER}
      MINIO_PRESIGN_PASSWORD: ${MINIO_PRESIGN_PASSWORD}
      PRESIGN_EXPIRY_HOURS: ${PRESIGN_EXPIRY_HOURS}
    networks:
      - lab

  # ---------------------------------------------------------------------------
  # minio-exposto — encaminhador L4 que torna o MinIO alcançável pelo navegador,
  # reproduzindo o estado ATUAL de produção. Fica sob profile porque expor o
  # MinIO é justamente o que a PoC quer eliminar.
  #   ligar:   docker compose --profile demo up -d
  #   desligar: docker compose --profile demo down
  # ---------------------------------------------------------------------------
  minio-exposto:
    image: alpine/socat:latest
    container_name: mpl-minio-exposto
    profiles:
      - demo
    command: TCP-LISTEN:9000,fork,reuseaddr TCP:minio:9000
    ports:
      - "${MINIO_DIRECT_PORT}:9000"
    networks:
      - lab
    depends_on:
      - minio

  # ---------------------------------------------------------------------------
  # mc — client auxiliar, efêmero. Usado apenas via `docker compose run`.
  # ---------------------------------------------------------------------------
  mc:
    image: minio/mc:latest
    profiles:
      - tools
    entrypoint: ["/bin/sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PRESIGN_USER: ${MINIO_PRESIGN_USER}
      MINIO_PRESIGN_PASSWORD: ${MINIO_PRESIGN_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      TEST_OBJECT: ${TEST_OBJECT}
      PUBLIC_HOST: ${PUBLIC_HOST}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT}
      MINIO_DIRECT_HOST: ${MINIO_DIRECT_HOST}
      PRESIGN_EXPIRY: ${PRESIGN_EXPIRY}
    volumes:
      - ./assets:/assets:ro
      - ./policies:/policies:ro
      # As duas CAs do laboratório, para o mc validar tanto o proxy quanto o
      # MinIO em vez de usar --insecure.
      - ./nginx/certs/ca-publica.crt:/root/.mc/certs/CAs/lab-ca-publica.crt:ro
      - ./nginx/certs/ca-interna.crt:/root/.mc/certs/CAs/lab-ca-interna.crt:ro
    networks:
      - lab
    depends_on:
      - minio

networks:
  lab:
    driver: bridge

volumes:
  minio-data:
