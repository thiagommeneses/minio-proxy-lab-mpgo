# ===========================================================================
# NGINX — proxy reverso do MinIO
#
# ATENÇÃO ÀS PORTAS
# As portas abaixo (8080 e 8443) precisam ser as MESMAS de NGINX_HTTP_PORT e
# NGINX_HTTPS_PORT no .env, porque:
#   - o compose publica  ${NGINX_HTTPS_PORT}:${NGINX_HTTPS_PORT}  no host;
#   - a porta faz parte do header Host e, portanto, da assinatura SigV4.
# Alterar a porta em um lugar só produz SignatureDoesNotMatch.
# Use scripts/up.sh em vez de `docker compose up -d`: ele compara os dois
# arquivos antes de subir.
#
# Mesma regra vale para server_name x PUBLIC_HOST.
# ===========================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log desenhado para depurar este laboratório: mostra o Host recebido
    # (o que a assinatura cobre), o status e o Range de cada requisição.
    # Usa $uri e NÃO $request: a query string carrega a assinatura, e gravá-la
    # em disco daria acesso ao objeto a quem lesse o log.
    log_format lab '$remote_addr [$time_local] "$request_method $uri" '
                   'host="$http_host" status=$status range="$http_range" '
                   'sent=$body_bytes_sent upstream=$upstream_status rt=$request_time';

    access_log  /var/log/nginx/access.log lab;
    sendfile    on;
    server_tokens off;

    # Limite padrão pequeno. A rota do S3 sobrescreve com um valor alto e
    # explícito — deixar 0 (ilimitado) valendo para tudo é o que se quer evitar.
    client_max_body_size 1m;

    # Proteção contra abuso sem estrangular player.
    # limit_conn (conexões simultâneas por IP) é seguro para vídeo; limit_req
    # não é, porque o seek dispara uma rajada legítima de requisições Range.
    # limit_rate também foi descartado: a taxa correta depende do bitrate, e
    # errar para baixo trava a reprodução de vídeos longos.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    upstream minio_s3 {
        server minio:9000;
        keepalive 16;
    }

    # -----------------------------------------------------------------------
    # HTTP — mesmo comportamento do HTTPS, sem TLS.
    # Serve para separar "problema de certificado" de "problema de proxy".
    # -----------------------------------------------------------------------
    server {
        listen      8080 default_server;
        server_name videos.lab.local;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx ok\n";
        }

        location / {
            proxy_pass http://minio_s3;

            # >>> O ponto crítico do laboratório <<<
            # Repassa o Host exatamente como o cliente enviou, com porta.
            # Reescrever para "minio:9000" quebraria a assinatura SigV4.
            proxy_set_header Host              $http_host;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # O MinIO devolve HSTS em toda resposta. Sobre HTTP isso não faz
            # sentido e, pior, o navegador aplicaria a política ao host inteiro
            # (HSTS ignora a porta), passando a forçar HTTPS nesta porta 8080 e
            # inutilizando justamente o caminho de diagnóstico sem TLS.
            proxy_hide_header Strict-Transport-Security;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Streaming: entrega os bytes conforme chegam, em vez de acumular
            # o arquivo inteiro antes de responder. Sem isso o player trava.
            proxy_buffering         off;
            proxy_request_buffering off;

            # Alto o bastante para upload de vídeo através do proxy, mas
            # explícito — diferente de 0, que remove qualquer limite.
            client_max_body_size 5g;

            # Generoso porque um player abre várias conexões e, atrás de NAT,
            # muitos usuários compartilham o mesmo IP. Revisar se o laboratório
            # virar produção com clientes atrás de proxy corporativo.
            limit_conn perip 100;

            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # O header Range é repassado automaticamente (não há cache aqui),
            # o que preserva o 206 Partial Content usado pelo seek do player.
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS — caminho principal. É este certificado que o usuário final vê,
    # nunca o do MinIO.
    # -----------------------------------------------------------------------
    server {
        listen      8443 ssl default_server;
        server_name videos.lab.local;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx ok (tls)\n";
        }

        location / {
            proxy_pass http://minio_s3;

            # >>> O ponto crítico do laboratório <<<
            proxy_set_header Host              $http_host;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Descarta o HSTS de um ano que o MinIO emite e assume o controle
            # da política aqui, no proxy.
            #
            # max-age=0 é deliberado NO LABORATÓRIO: HSTS vale por host e
            # ignora a porta, então qualquer valor positivo faria o navegador
            # forçar HTTPS em videos.lab.local:8080 e quebrar o caminho de
            # diagnóstico. O valor 0 também limpa a política já gravada por
            # execuções anteriores.
            #
            # EM PRODUÇÃO: 86400 (1 dia) durante a implantação, para poder
            # reverter sem deixar clientes presos, e 31536000 (1 ano) depois
            # que todo o caminho estiver comprovadamente em HTTPS.
            proxy_hide_header Strict-Transport-Security;
            add_header Strict-Transport-Security "max-age=0" always;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering         off;
            proxy_request_buffering off;

            client_max_body_size 5g;
            limit_conn perip 100;

            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }
    }
}
