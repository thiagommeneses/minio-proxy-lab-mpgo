# ===========================================================================
# NGINX — proxy reverso do MinIO + aplicação ThemísIA (simulada)
#
# Reproduz o formato A decidido para produção: aplicação e mídia no MESMO host
# público, separadas por caminho.
#
#   https://intranet.lab.local:8443/themisia/     -> aplicação (FastAPI)
#   https://intranet.lab.local:8443/memoriais/... -> MinIO (bucket "memoriais")
#
# O PRIMEIRO SEGMENTO DO CAMINHO DE MÍDIA É O NOME DO BUCKET, e não pode ser
# reescrito. A assinatura SigV4 cobre o path além do Host: qualquer rewrite
# aqui produz SignatureDoesNotMatch. Por isso não existe "prefixo livre" —
# o prefixo É o bucket.
#
# ATENÇÃO ÀS PORTAS
# 8080 e 8443 precisam ser iguais a NGINX_HTTP_PORT e NGINX_HTTPS_PORT do .env.
# Use scripts/up.sh, que compara os dois arquivos antes de subir.
# ===========================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Usa $uri e NÃO $request: a query string carrega a assinatura, e gravá-la
    # em disco daria acesso ao objeto a quem lesse o log.
    log_format lab '$remote_addr [$time_local] "$request_method $uri" '
                   'host="$http_host" status=$status range="$http_range" '
                   'sent=$body_bytes_sent upstream=$upstream_status rt=$request_time';

    access_log  /var/log/nginx/access.log lab;
    sendfile    on;
    server_tokens off;

    client_max_body_size 1m;

    # limit_conn é seguro para vídeo; limit_req não é, porque o seek dispara
    # uma rajada legítima de Range. limit_rate exigiria conhecer o bitrate.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    upstream minio_s3 {
        server minio:9000;
        keepalive 16;
    }

    upstream themisia_app {
        server app:8000;
        keepalive 8;
    }

    # -----------------------------------------------------------------------
    # HTTP — mesmo roteamento, sem TLS. Isola problema de certificado de
    # problema de proxy.
    # -----------------------------------------------------------------------
    server {
        listen      8080 default_server;
        server_name intranet.lab.local;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx ok\n";
        }

        location = / {
            return 302 /themisia/;
        }

        location /themisia/ {
            proxy_pass http://themisia_app/;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ^~ garante precedência sobre qualquer location regex.
        location ^~ /memoriais/ {
            include /etc/nginx/conf.d/minio-proxy.inc;
            proxy_hide_header Strict-Transport-Security;
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS — caminho principal. Certificado emitido pela ca-publica, que
    # simula a GlobalSign e é a que o navegador deve confiar.
    # -----------------------------------------------------------------------
    server {
        listen      8443 ssl default_server;
        server_name intranet.lab.local;

        ssl_certificate     /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx ok (tls)\n";
        }

        location = / {
            return 302 /themisia/;
        }

        location /themisia/ {
            proxy_pass http://themisia_app/;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location ^~ /memoriais/ {
            include /etc/nginx/conf.d/minio-proxy.inc;

            # Descarta o HSTS de um ano do MinIO e assume a política aqui.
            # max-age=0 é deliberado no laboratório: HSTS vale por host e
            # ignora a porta, então qualquer valor positivo forçaria HTTPS na
            # 8080 e mataria o caminho de diagnóstico. Também limpa política
            # já gravada por execuções anteriores.
            # EM PRODUÇÃO: 86400 na implantação, 31536000 depois.
            proxy_hide_header Strict-Transport-Security;
            add_header Strict-Transport-Security "max-age=0" always;
        }
    }
}
