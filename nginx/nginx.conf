# ===========================================================================
# NGINX — proxy reverso do MinIO
#
# ATENÇÃO ÀS PORTAS
# As portas abaixo (8080 e 8443) precisam ser as MESMAS de NGINX_HTTP_PORT e
# NGINX_HTTPS_PORT no .env, porque:
#   - o compose publica  ${NGINX_HTTPS_PORT}:${NGINX_HTTPS_PORT}  no host;
#   - a porta faz parte do header Host e, portanto, da assinatura SigV4.
# Alterar a porta em um lugar só produz SignatureDoesNotMatch.
# O script scripts/lib/common.sh compara os dois e aborta se divergirem.
#
# Mesma regra vale para server_name x PUBLIC_HOST.
# ===========================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log desenhado para depurar este laboratório: mostra o Host recebido
    # (o que a assinatura cobre), o status e o Range de cada requisição.
    log_format lab '$remote_addr [$time_local] "$request_method $uri" '
                   'host="$http_host" status=$status range="$http_range" '
                   'sent=$body_bytes_sent upstream=$upstream_status rt=$request_time';

    access_log  /var/log/nginx/access.log lab;
    sendfile    on;
    server_tokens off;

    upstream minio_s3 {
        server minio:9000;
        keepalive 16;
    }

    # -----------------------------------------------------------------------
    # HTTP — mesmo comportamento do HTTPS, sem TLS.
    # Serve para separar "problema de certificado" de "problema de proxy".
    # -----------------------------------------------------------------------
    server {
        listen      8080 default_server;
        server_name videos.lab.local;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx ok\n";
        }

        location / {
            proxy_pass http://minio_s3;

            # >>> O ponto crítico do laboratório <<<
            # Repassa o Host exatamente como o cliente enviou, com porta.
            # Reescrever para "minio:9000" quebraria a assinatura SigV4.
            proxy_set_header Host              $http_host;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Streaming: entrega os bytes conforme chegam, em vez de acumular
            # o arquivo inteiro antes de responder. Sem isso o player trava.
            proxy_buffering         off;
            proxy_request_buffering off;

            # Sem limite de corpo — evita 413 se o upload passar pelo proxy.
            client_max_body_size 0;

            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # O header Range é repassado automaticamente (não há cache aqui),
            # o que preserva o 206 Partial Content usado pelo seek do player.
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS — caminho principal. É este certificado que o usuário final vê,
    # nunca o do MinIO.
    # -----------------------------------------------------------------------
    server {
        listen      8443 ssl default_server;
        server_name videos.lab.local;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx ok (tls)\n";
        }

        location / {
            proxy_pass http://minio_s3;

            # >>> O ponto crítico do laboratório <<<
            proxy_set_header Host              $http_host;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering         off;
            proxy_request_buffering off;
            client_max_body_size    0;

            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }
    }
}
