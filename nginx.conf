events {}

http {
  # Mostra o Host recebido. Protegido pela URL pré-assinada, então não há problema de segurança.
  log_format simples '$remote_addr "$request_method $uri" host=$http_host status=$status range=$http_range';
  access_log /var/log/nginx/access.log simples;

  server {
    listen 8443 ssl;
    server_name intranet.lab.local;

    ssl_certificate     /etc/nginx/certs/proxy.crt;
    ssl_certificate_key /etc/nginx/certs/proxy.key;

    # A aplicação
    location / {
      proxy_pass http://app:8000;
      proxy_set_header Host $http_host;
    }

    # Os vídeos. A primeira parte do caminho/endereço na url é o nome do bucket.
    location /memoriais/ {
      proxy_pass https://minio:9000;

      # A parte que importa: repassa o Host sem mudar nada.
      proxy_set_header Host $http_host;

      # O certificado do MinIO tem o nome "minio", diferente do Host acima.
      proxy_ssl_name minio;
      proxy_ssl_trusted_certificate /etc/nginx/certs/ca-interna.crt;
      proxy_ssl_verify on;

      # Entrega os bytes conforme chegam, senão o vídeo trava.
      proxy_buffering off;
      proxy_http_version 1.1;

      # O MinIO manda HSTS e isso atrapalha no laboratório.
      proxy_hide_header Strict-Transport-Security;
    }
  }
}
